title = Tiles-to-pyramid

name = Tiles to Pyramid
description = Stitches microscope tiles (filename coordinates, TileConfiguration.txt, MicroManager, Vectra) into pyramidal OME-TIFF or OME-ZARR images, with optional content-based tile registration and merging of per-channel stitches into one multichannel image. MicroManager acquisitions can first be combined over time points and z-slices and corrected with a flat-field profile.

